name: Refresh board and deploy Pages
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Bake the board into data/board.json
        env:
          GH_TOKEN: ${{ secrets.BOARD_TOKEN }}
        run: python3 scripts/fetch_board.py
      - name: Stage site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/board.json _site/data/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # Uploaded artifact metadata can take time to appear in GitHub's deploy API.
      - name: Wait before the deploy retry
        if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
