<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark"><meta name="theme-color" content="#9cc5ab">
<title>HN explorer board</title>
<style>
:root{--bg:#f2efe4;--card:#fbfaf4;--ink:#25302b;--mute:#6f7a72;--line:#dcd8c8;--chip:#e9e6d6;
--pitch:#9cc5ab;--pitch2:#6f9f84;--sky:#a9cde2;--clay:#e6ab92;--butter:#f0dc9d;--lav:#cfc3e3;--board:#2b3631;--digit:#cfe9d6;--glow:rgba(255,246,200,.0)}
@media(prefers-color-scheme:dark){:root{--bg:#141c19;--card:#1b2622;--ink:#ecf0e6;--mute:#93a198;--line:#2a3832;--chip:#25312c;--board:#0b100e;--glow:rgba(255,244,196,.10)}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;background:var(--bg)}body{min-height:100vh}
body{margin:0;background:var(--bg);background-image:radial-gradient(120% 60% at 50% -10%,var(--glow),transparent 60%);background-repeat:no-repeat;color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{max-width:640px;margin:0 auto;padding:16px 14px 6px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--pitch2)}
.live{display:inline-flex;align-items:center;gap:6px;font:700 10.5px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em;color:var(--ink);background:var(--chip);border-radius:99px;padding:5px 9px}
.live:before{content:"";width:7px;height:7px;border-radius:50%;background:#e57f6a;box-shadow:0 0 0 0 rgba(229,127,106,.6);animation:p 2s infinite}
@keyframes p{70%{box-shadow:0 0 0 7px rgba(229,127,106,0)}100%{box-shadow:0 0 0 0 rgba(229,127,106,0)}}
@media(prefers-reduced-motion:reduce){.live:before{animation:none}}
h1{font-size:22px;margin:8px 0 0;letter-spacing:-.015em}
.sub a{color:inherit;text-decoration:underline}
.sub{color:var(--mute);font-size:12px;margin-top:2px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.stats{border:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:14px 0 4px;background:var(--board);border-radius:14px;padding:10px 4px;position:relative;overflow:hidden}
.stats:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 28px,transparent 28px 56px);pointer-events:none}
.stat{text-align:center;padding:2px 4px;border-left:1px solid rgba(255,255,255,.08)}.stat:first-child{border-left:0}
.stat b{display:block;font:700 27px/1.1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--digit);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.stat:first-child b{color:var(--clay)}.stat:nth-child(2) b{color:var(--butter)}
.stat span{font-size:9.5px;color:#a8b8ad;text-transform:uppercase;letter-spacing:.12em}
nav{position:sticky;top:0;z-index:5;background:var(--bg);padding:9px 12px;display:flex;gap:6px;max-width:640px;margin:0 auto}
nav button{flex:1;font:inherit;font-size:12.5px;font-weight:700;padding:9px 2px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--mute);cursor:pointer}
nav button[aria-selected=true]{background:var(--pitch);color:#1d2b24;border-color:var(--pitch)}
nav button i{font-style:normal;font-family:ui-monospace,Menlo,monospace;opacity:.75;font-weight:600;margin-left:4px;font-size:11.5px}
main{max-width:640px;margin:0 auto;padding:6px 12px 40px}
.item{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--kit,var(--line));border-radius:12px;padding:11px 13px;margin-bottom:8px}
.item:active{transform:scale(.995)}
.row{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.t{font-weight:650;font-size:15px}.s{color:var(--mute);font-size:13px;margin-top:2px}
.num{color:var(--mute);font:600 12px ui-monospace,Menlo,monospace;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:10.5px;font-weight:700;letter-spacing:.04em;border-radius:6px;padding:3px 8px;background:var(--chip);color:var(--mute);text-transform:uppercase}
.st-need{--kit:var(--clay)}.st-qa{--kit:var(--butter)}.st-ready,.st-dev{--kit:var(--sky)}.st-grooming{--kit:var(--lav)}.st-defined{--kit:var(--line)}
.chip.k-need{background:var(--clay);color:#4a2517}.chip.k-qa{background:var(--butter);color:#4a3d12}.chip.k-ready,.chip.k-dev{background:var(--sky);color:#16384b}.chip.k-grooming{background:var(--lav);color:#33294d}
.chip.now{background:var(--butter);color:#4a3d12}.chip.next{background:var(--sky);color:#16384b}.chip.later{background:var(--chip)}
.chip.prog{font-family:ui-monospace,Menlo,monospace}
.bar{height:7px;border-radius:9px;background:var(--chip);margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:repeating-linear-gradient(90deg,var(--pitch2) 0 14px,var(--pitch) 14px 28px)}
.grp{font:800 11px ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.16em;color:var(--mute);margin:16px 2px 8px;display:flex;justify-content:space-between;align-items:center}
.grp:after{content:"";flex:1;height:1px;background:var(--line);margin-left:10px;order:1}.grp span+span{order:2;margin-left:10px}
.empty{text-align:center;color:var(--mute);padding:10px;font-size:13px}

.nm{display:inline-flex;align-items:center;gap:5px;font:700 10.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;border-radius:99px;padding:5px 9px;text-decoration:none;cursor:pointer;border:0}
.nm.clear{background:transparent;color:var(--pitch2);padding:5px 4px}.nm.clear svg{width:16px;height:16px}
.nm.wait{background:var(--clay);color:#4a2517}
.right{display:flex;align-items:center;gap:6px}
.stats{grid-template-columns:repeat(4,1fr)}.stat:nth-child(1) b{color:var(--sky)}.stat:nth-child(2) b{color:var(--digit)}.stat:nth-child(3) b{color:var(--butter)}.stat:nth-child(4) b{color:var(--clay)}
.stat:first-child b{color:var(--sky)}
.age{color:var(--mute);font:600 11px ui-monospace,Menlo,monospace}.stuck{background:var(--butter);color:#4a3d12}
.cap{color:var(--mute);font-size:12px;margin:-2px 2px 8px}
footer{max-width:640px;margin:0 auto;padding:0 16px 24px;color:var(--mute);font-size:12px;text-align:center}
footer a{color:inherit}
</style></head><body>
<header><div class="top"><span class="brand">Grandstand</span><span class="right"><span id="nm"></span><span class="live" id="live">LIVE</span></span></div><h1>HN explorer board</h1><div class="sub" id="gen">Loading...</div><div class="stats" id="stats"></div></header>
<nav id="tabs" role="tablist"></nav>
<main id="main"></main>
<footer id="foot"></footer><footer style="padding-top:0">Made with <a href="https://github.com/agamrafaeli-instinct/grandstand">Grandstand</a>: watch your coding agent work</footer>
<script>
const TABS=[['sprint','Sprint'],['epics','Epics'],['pipe','Pipeline'],['need','Needs me']];
let ORDER=[];
let NEED=[],BUILD=[],GROUPS=[],D=null,tab=(location.hash||'#sprint').slice(1);if(!TABS.some(t=>t[0]===tab))tab='sprint';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clean=t=>t.replace(/^\[Epic\]\s*-\s*/,'');
function split(t){const c=clean(t),p=c.split(' - ');return p.length>1&&/^\[Epic\]/.test(t)?[p[0],p.slice(1).join(' - ')]:[c,''];}
function ago(iso){const s=(Date.now()-new Date(iso))/1000;if(s<90)return'just now';if(s<3600)return Math.round(s/60)+' min ago';if(s<86400)return Math.round(s/3600)+' h ago';return Math.round(s/86400)+' d ago';}
const slug=x=>x==='Needs decision'?'need':String(x||'').toLowerCase().replace(/[^a-z]/g,'');
function item(i){const[a,b]=split(i.title);const epic=i.epic;
 const chips=[`<span class="chip k-${slug(i.status)}">${esc(i.status||'No status')}</span>`];
 if(i.group)chips.push(`<span class="chip ${i.group.toLowerCase()}">${esc(i.group)}</span>`);
 if(!epic&&i.estimate)chips.push(`<span class="chip est">${i.estimate<1?Math.round(i.estimate*60)+' min':'~'+i.estimate+' h'}</span>`);
 if(epic&&i.total)chips.push(`<span class="chip prog">${i.done}/${i.total} done</span>`);
 const dd=(Date.now()-new Date(i.updated))/864e5;if(!epic&&(i.status==='Dev')){chips.push(dd>3?`<span class="chip stuck">quiet ${Math.round(dd)} d</span>`:`<span class="age">moved ${ago(i.updated)}</span>`);}
 const bar=epic&&i.total?`<div class="bar"><i style="width:${Math.round(100*i.done/i.total)}%"></i></div>`:'';
 return `<a class="item st-${slug(i.status)}" href="${esc(i.url)}"><div class="row"><div><div class="t">${esc(a)}</div>${b?`<div class="s">${esc(b)}</div>`:''}</div><div class="num">#${i.number}</div></div><div class="chips">${chips.join('')}</div>${bar}</a>`;}
function list(arr,empty){return arr.length?arr.map(item).join(''):`<div class="empty">${empty}</div>`;}
const gi=g=>{const k=GROUPS.indexOf(g);return k<0?99:k};
const by=(f)=>D.items.filter(f);
function views(){
 const need=by(i=>NEED.includes(i.status));
 const build=by(i=>BUILD.includes(i.status)&&!i.epic);const dev=build.filter(i=>i.status==='Dev'),ready=build.filter(i=>i.status!=='Dev');const now=by(i=>i.epic&&i.group==='Now');
 const epics=by(i=>i.epic).sort((a,b)=>gi(a.group)-gi(b.group)||a.number-b.number);
 return{need,build,dev,ready,now,epics};}
function render(){
 const v=views();
 const nmEl=document.getElementById('nm');nmEl.innerHTML=v.need.length?`<a class="nm wait" href="#need">${v.need.length} WAITING</a>`:`<span class="nm clear" title="All clear: nothing needs you" aria-label="All clear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg></span>`;nmEl.firstChild.onclick=e=>{if(v.need.length){e.preventDefault();tab='need';location.hash='need';render();window.scrollTo(0,0)}};
 document.getElementById('tabs').innerHTML=TABS.filter(t=>t[0]!=='need'||v.need.length).map(([k,n])=>{const c=k==='pipe'?D.items.length:k==='sprint'?v.dev.length+v.ready.length:(v[k]||[]).length;return`<button role="tab" aria-selected="${k===tab}" data-t="${k}">${n}<i>${c}</i></button>`}).join('');
 let h='';
 if(tab==='need')h=list(v.need,'Nothing is waiting on you.');
 else if(tab==='sprint'){const g=(n,a,cap)=>`<div class="grp"><span>${n}</span><span>${a.length}</span></div>`+(cap?`<div class="cap">${cap}</div>`:'');
  h=(D.recent_done&&D.recent_done.length?g('Last done',D.recent_done)+D.recent_done.map(x=>`<a class="item" href="${esc(x.url)}"><div class="row"><div><div class="t">${esc(x.title)}</div><div class="s">${new Date(x.closed).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})} (${ago(x.closed)})</div></div><div class="num">#${x.number}</div></div></a>`).join(''):'')+g('In flight',v.dev)+list(v.dev,'Nothing in Dev right now.')+g('Up next',v.ready)+list(v.ready,'Nothing groomed and ready.');
  if(v.need.length)h+=g('Waiting on review',v.need,'')+v.need.map(item).join('');
  if(v.now.length)h+=g('Now: epic progress',v.now)+v.now.map(item).join('');}
 else if(tab==='epics'){let last;for(const e of v.epics){const g=e.group||'No group';if(g!==last){h+=`<div class="grp"><span>${g}</span></div>`;last=g}h+=item(e)}}
 else for(const s of ORDER){const a=D.items.filter(i=>i.status===s);if(!a.length)continue;h+=`<div class="grp"><span>${s}</span><span>${a.length}</span></div>`+a.map(item).join('')}
 document.getElementById('main').innerHTML=h;
 document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;location.hash=tab;render();window.scrollTo(0,0)});}
fetch('data/board.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{D=d;NEED=d.needs_me||[];BUILD=d.building||[];GROUPS=d.group_order||[];ORDER=(d.statuses||[]).filter(s=>d.counts[s]);document.title=d.title;document.querySelector('h1').textContent=d.title;
 document.getElementById('gen').textContent='Updated '+ago(d.generated)+' · refreshes every 5 min and on every board change';
 if(d.working)document.getElementById('gen').insertAdjacentHTML('afterend',`<div class="sub" id="wn"><b style="color:#2da44e">&#9679; WORKING NOW</b> · <a href="${esc(d.working.url)}">${esc(d.working.name)}</a> ${d.working.started?'started '+ago(d.working.started):'in Dev'}</div>`);
 const c=d.counts||{};const sum=a=>a.reduce((t,k)=>t+(c[k]||0),0);const rest=ORDER.filter(s=>!NEED.includes(s)&&!BUILD.includes(s)).slice(-2).reverse();
 document.getElementById('stats').innerHTML=[['In dev',c.Dev||0],['Ready',c.Ready||0],['Grooming',c.Grooming||0],['Defined',c.Defined||0]].map(([n,x])=>`<div class="stat"><b>${x}</b><span>${n}</span></div>`).join('');
 document.getElementById('foot').innerHTML=`${d.hidden_tasks} finished tasks hidden. <a href="${esc(d.project_url)}">Open the GitHub board</a>`;

 render();}).catch(e=>{document.getElementById('gen').textContent='Could not load the board data.'});
</script></body></html>
